[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-google"
version = "0.2.0"
description = "Fondos de pantalla aleatorios desde Google Fotos para GNOME"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
wallpaper-google = "wallpaper_google.cli:main"

[tool.setuptools]
packages = ["wallpaper_google"]
